worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Matches settings.max_upload_bytes (50MB) in
    # backend/modules/document_intelligence/settings.py, with headroom -
    # nginx's own default (1MB) would otherwise reject document uploads
    # before they ever reach the backend.
    client_max_body_size 60m;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Static frontend (baked into this image by Dockerfile.frontend).
        # The frontend's own API_BASE constants call the backend directly
        # at 127.0.0.1:8000 (host-loopback only, same-machine use), not
        # through this proxy - these /api and /health locations exist so
        # this one origin is also usable end to end (e.g. from a real
        # remote client once a domain/cert replace the placeholder).
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Document processing runs synchronously and can take a while
            # for large PDFs - generous enough to avoid a proxy timeout
            # while a real job is still legitimately running.
            proxy_read_timeout 300s;
        }

        location = /health {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
